<div id="searchresult" class="list-group mt-2">
  {% for result in results %}
  <div class="list-group-item d-flex gap-2 p-0">
    <button type="button" class="list-group-item list-group-item-action border-0 d-flex justify-content-between align-items-center"
      hx-get="{% url 'filtertransaction' id=SO.id p=result.id %}?entry=manual" hx-target="#transactionform" hx-trigger="click" hx-swap="outerHTML">
      <span><strong>{{ result.ProductName }}</strong> <small class="text-muted">({{ result.Unit }})</small></span>
      <span><span class="badge bg-secondary">Buy {{ result.BuyingPrice }}</span> <span class="badge bg-primary">{{ result.RetailBaht }} B</span> <span class="badge bg-warning text-dark">{{ result.RetailKyat }} K</span> <small>Stock: {{ result.wh_stock }}</small></span>
    </button>
    <button type="button" class="btn btn-outline-primary m-1" title="View or change product prices"
      aria-label="View or change prices for {{ result.ProductName }}" hx-get="{% url 'editpricemodal' result.id %}"
      hx-target="#modals-here" hx-swap="innerHTML"
      _="on htmx:afterOnLoad wait 10ms then add .show to #modal then add .show to #modal-backdrop">
      <i class="bi bi-tags"></i>
    </button>
  </div>
  {% empty %}
  {% if search_text %}<div class="list-group-item text-muted">No matching products found.</div>{% endif %}
  {% endfor %}
</div>
