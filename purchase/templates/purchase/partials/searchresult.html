<ul id="searchresult" class="list-group pd-search-results mt-2">
  {% if results %}
  <li class="list-group-item list-group-item-secondary small fw-semibold">Choose a product</li>
  {% endif %}
  {% for result in results %}
  <li class="list-group-item p-0 border-0">
    <button type="button" class="list-group-item list-group-item-action border-0" hx-get="{% url 'filtertransactionp' id=PO.id p=result.id %}"
        hx-target="#transactionform" hx-swap="outerHTML" hx-trigger="click" hx-indicator=".htmx-indicator">
      <span class="pd-search-result">
        <span class="pd-search-result-name">{{ result.ProductName }} <small class="text-muted">{{ result.Unit }}</small></span>
        <span class="pd-search-result-price"><small>Buying</small>{{ result.BuyingPrice }}</span>
        <span class="pd-search-result-price"><small>Retail</small>{{ result.RetailPrice }}</span>
      </span>
    </button>
  </li>
  {% endfor %}
</ul>
